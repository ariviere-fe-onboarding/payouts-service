# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
# CodeRabbit config for payouts-service: the Finance Platform service that holds bank data.
language: en-US
early_access: true

tone_instructions: >-
  Senior reviewer. Open each finding with "Observation:", name the line and the invariant
  at risk, then explain impact. No emoji, no filler.

reviews:
  profile: chill
  request_changes_workflow: true
  high_level_summary: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  suggested_reviewers: true
  poem: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false

  path_filters:
    - "!.venv/**"
    - "!**/__pycache__/**"

  path_instructions:
    - path: "**/{AGENTS.md,CLAUDE.md,.cursorrules,copilot-instructions.md}"
      instructions: |
        Agent-instruction files are a security-critical surface. Flag changes that expand
        agent authority, weaken guardrails, or skip review, testing, or approval steps.
    - path: "payouts/{signing,main,service}.py"
      instructions: |
        This code moves money. Every webhook must be signature-verified with a constant-time
        comparison and processed at most once per event and per expense. Flag any change
        that relaxes verification, idempotency, or contract validation.
    - path: "payouts/{models,crypto,schemas}.py"
      instructions: |
        Bank account and routing numbers must stay encrypted at rest and must never leave
        this service unmasked. Flag any response, log line, or column that exposes them.
    - path: "tests/contract/**"
      instructions: |
        This fixture pins the expense.approved v1 contract shared with expense-app. Any change
        here is a cross-repository contract change and must follow the API contracts guideline.
    - path: "**/*.tf"
      instructions: |
        Infrastructure as code. Flag public exposure, missing encryption, permissive IAM, and
        missing public-access blocks.

  tools:
    ruff:
      enabled: true
    gitleaks:
      enabled: true
    semgrep:
      enabled: true
    checkov:
      enabled: true
    actionlint:
      enabled: true
    ast-grep:
      essential_rules: true
      rule_dirs:
        - ".coderabbit/ast-grep-rules"

  pre_merge_checks:
    issue_assessment:
      mode: warning
    custom_checks:
      - name: "Security Gate"
        mode: error
        instructions: >-
          Fail only when the review finds a SECURITY-RELATED major or critical issue, for
          example: weakened webhook signature verification, secrets in code or logs, unmasked
          or unencrypted bank data, missing authorization, injection, SSRF, path traversal,
          or insecure infrastructure. Do not fail on minor or purely functional issues.
      - name: "Contract compatibility"
        mode: warning
        instructions: >-
          Fail when the change alters the expense.approved webhook contract (fields, types,
          units, signature scheme, or idempotency) without bumping the version as required
          by the API contracts guideline, or would break the producer in expense-app.

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto
  code_guidelines:
    enabled: true
    filePatterns:
      # Organization standards live in a separate repository; findings here can cite them.
      - files: "ariviere-fe-onboarding/engineering-standards:guidelines/*.md"
        applyTo: "**/*.py"

  automatic_repository_linking: false
  linked_repositories:
    - repository: "ariviere-fe-onboarding/expense-app"
      instructions: >-
        expense-app produces the expense.approved webhook this service consumes and calls the
        /internal API. When a change affects that contract or API, check the producer and cite
        the affected file in expense-app.
